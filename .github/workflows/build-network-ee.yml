name: Build Network Execution Environment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "execution-environment/**"
      - ".github/workflows/build-network-ee.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/mmortezaseif-dot/network-capstone-ee
  IMAGE_TAG: "1.0"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-builder
        run: python -m pip install --upgrade ansible-builder

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build execution environment
        working-directory: execution-environment
        run: |
          ansible-builder build \
            --container-runtime docker \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Push execution environment
        run: docker push "${IMAGE_NAME}:${IMAGE_TAG}"
